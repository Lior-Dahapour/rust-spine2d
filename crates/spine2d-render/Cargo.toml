[package]
name = "spine2d-render"
version.workspace = true
edition.workspace = true
publish = false
license-file = "../../LICENSE-SPINE"
description = "Engine-agnostic rendering support for Spine skeletons: render commands, clipping and bounds"

[dependencies]
spine2d-core = { path = "../spine2d-core" }

[dev-dependencies]
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
ctor = "1.0.13"
