[package]
name = "spine2d-core"
version.workspace = true
edition.workspace = true
publish = false
license-file = "../../LICENSE-SPINE"
description = "Engine-agnostic core of the Spine 4.3 runtime (skeleton, poses, animation)"

[dependencies]
glam = "0.34.1"
rustc-hash = "2.1.3"
serde_json = { version = "1.0.154", features = ["preserve_order", "arbitrary_precision"] }
slotmap = "1.1.1"
smallvec = "1.16.3"
smol_str = "0.3"
thiserror = "2"
visibility = "0.1"

[dev-dependencies]
ctor = "1.0.13"

[features]
# Makes the `_with` methods and the `detached` constructors public. They are for building a
# runtime that keeps the skeleton data itself; everyone else uses `Skeleton::new`.
external-data = []

[[test]]
name = "detached"
required-features = ["external-data"]
