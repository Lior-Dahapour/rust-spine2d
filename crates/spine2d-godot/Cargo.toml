[package]
name = "spine2d-godot"
version.workspace = true
edition.workspace = true
publish = false
license-file.workspace = true
description = "Godot 4 extension for the Spine 4.3 Rust runtime, built on one shared ECS world"

[lib]
crate-type = ["cdylib"]

[dependencies]
spine2d-core = { path = "../spine2d-core" }
spine2d-render = { path = "../spine2d-render" }
spine2d-ecs = { path = "../spine2d-ecs" }
bevy_ecs = { version = "0.19.1", default-features = false, features = ["std"] }
godot = { version = "0.5.5", features = ["api-4-5", "experimental-threads"] }
bytemuck = "1"
rustc-hash = "2.1.3"
slotmap = "1.1.1"
smallvec = "1.16.3"
thiserror = "2"
