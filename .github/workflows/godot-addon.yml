# Builds the Godot addon for Linux (x86_64), Windows (x86_64) and macOS (universal, arm64 and
# x86_64) on every push to main that changes the code, and merges the libraries into one addon
# folder (artifact "rust-spine2d-addon", with the `addons` folder at its root). It can also be
# started by hand from the Actions tab.
#
# Linux arm64 is not built here: the extension file points x86_64 and arm64 at the same file name,
# so build that one on an ARM machine with crates/spine2d-godot/package.sh.
name: godot-addon

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/godot-addon.yml"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add the Intel and Apple silicon targets (the macOS library is universal)
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Build and package
        run: sh crates/spine2d-godot/package.sh --out out
      - uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.os }}
          path: out

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: addon-*
          path: merged
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        with:
          name: rust-spine2d-addon
          path: merged
