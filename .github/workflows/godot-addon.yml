# Builds the Godot addon for Linux (x86_64) and Windows (x86_64) on every push to main that changes
# the code, and merges the libraries into one addon folder (artifact "rust-spine2d-addon", with the
# `addons` folder at its root).
#
# The macOS library is built only on request (Actions tab, "Run workflow", tick the box), because
# macOS minutes count ten times on private repositories. You can also build it on a Mac with
# crates/spine2d-godot/package.sh and add it to the addon by hand.
#
# This workflow has not run yet. It was written alongside package.sh, which has only been run on
# macOS arm64, so expect to fix small things after the first run.
name: godot-addon

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/godot-addon.yml"
  workflow_dispatch:
    inputs:
      macos:
        description: Also build the macOS library (universal, arm64 and x86_64)
        type: boolean
        default: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build and package
        run: sh crates/spine2d-godot/package.sh --out out
      - uses: actions/upload-artifact@v4
        with:
          name: addon-${{ matrix.os }}
          path: out

  build-macos:
    if: ${{ inputs.macos }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Add the Intel target (the macOS library is universal)
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin
      - name: Build and package
        run: sh crates/spine2d-godot/package.sh --out out
      - uses: actions/upload-artifact@v4
        with:
          name: addon-macos-latest
          path: out

  merge:
    needs: [build, build-macos]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: addon-*
          path: merged
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        with:
          name: rust-spine2d-addon
          path: merged
